# Railway: set the service **Root Directory** to `backend` (this folder).
# If Root Directory is wrong, `main:app` may not load or an old image may run without /coach/* routes.
[build]
builder = "nixpacks"

[deploy]
startCommand = "gunicorn main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:${PORT:-8000} --workers ${WEB_CONCURRENCY:-1} --timeout 120 --graceful-timeout 30 --keep-alive 75"
