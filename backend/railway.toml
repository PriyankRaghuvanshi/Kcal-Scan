# Railway: set the service **Root Directory** to `backend` (this folder).
# If Root Directory is wrong, config here is ignored and you may run an old image.
#
# watchPatterns: if the dashboard used narrow paths (e.g. only mobile/), backend edits
# would never trigger a new deploy — production would stay on ancient main.py forever.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["**/*"]

[deploy]
# Keep in sync with backend/Dockerfile CMD (uvicorn).
startCommand = "sh -c \"uvicorn main:app --host 0.0.0.0 --port ${PORT:-8080}\""
healthcheckPath = "/health"
healthcheckTimeout = 120
